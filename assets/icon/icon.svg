<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#C5EBFA"/>
      <stop offset="52%" stop-color="#7EC8E8"/>
      <stop offset="100%" stop-color="#3E96C4"/>
    </radialGradient>
    <radialGradient id="fur" cx="36%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#F3D3C0"/>
    </radialGradient>
    <linearGradient id="innerEar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4EE"/>
      <stop offset="100%" stop-color="#F5B8C8"/>
    </linearGradient>
    <linearGradient id="denim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B97D0"/>
      <stop offset="100%" stop-color="#2F6DA8"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="100%" stop-color="#F5C542"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#1A5278" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#lift)" transform="translate(512 512) scale(0.92) translate(-512 -512)">
    <!-- Ears -->
    <g transform="rotate(-18 418 340)">
      <rect x="352" y="176" width="132" height="300" rx="66" fill="url(#fur)"/>
      <rect x="382" y="210" width="72" height="196" rx="36" fill="url(#innerEar)"/>
    </g>
    <g transform="rotate(18 606 340)">
      <rect x="540" y="176" width="132" height="300" rx="66" fill="url(#fur)"/>
      <rect x="570" y="210" width="72" height="196" rx="36" fill="url(#innerEar)"/>
    </g>

    <!-- Yellow shirt and sleeves sit behind the head and overalls. -->
    <rect x="392" y="575" width="240" height="130" rx="46" fill="url(#shirt)"/>
    <circle cx="378" cy="668" r="46" fill="url(#shirt)"/>
    <circle cx="646" cy="668" r="46" fill="url(#shirt)"/>

    <!-- Head -->
    <circle cx="512" cy="468" r="176" fill="url(#fur)"/>

    <!-- Denim overalls with straps -->
    <rect x="448" y="600" width="46" height="130" rx="20" fill="url(#denim)"/>
    <rect x="530" y="600" width="46" height="130" rx="20" fill="url(#denim)"/>
    <rect x="368" y="668" width="288" height="150" rx="40" fill="url(#denim)"/>
    <circle cx="494" cy="700" r="9" fill="#F5C542"/>
    <circle cx="530" cy="700" r="9" fill="#F5C542"/>

    <!-- Carrot patch -->
    <ellipse cx="498" cy="748" rx="9" ry="16" fill="#7CB342" transform="rotate(-28 498 748)"/>
    <ellipse cx="526" cy="746" rx="9" ry="16" fill="#8BC34A" transform="rotate(24 526 746)"/>
    <path d="M512 752 C534 758 546 800 512 824 C478 800 490 758 512 752 Z" fill="#F08A2A"/>
    <path d="M500 790 C508 786 516 786 524 792" fill="none" stroke="#E07020" stroke-width="4" stroke-linecap="round"/>

    <!-- Face -->
    <ellipse cx="356" cy="500" rx="40" ry="24" fill="#F5B8C8" opacity="0.85"/>
    <ellipse cx="668" cy="500" rx="40" ry="24" fill="#F5B8C8" opacity="0.85"/>

    <ellipse cx="444" cy="450" rx="40" ry="46" fill="#5C3D2E"/>
    <ellipse cx="580" cy="450" rx="40" ry="46" fill="#5C3D2E"/>
    <ellipse cx="430" cy="432" rx="15" ry="17" fill="#FFFFFF"/>
    <ellipse cx="566" cy="432" rx="15" ry="17" fill="#FFFFFF"/>
    <ellipse cx="458" cy="468" rx="7" ry="7" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="594" cy="468" rx="7" ry="7" fill="#FFFFFF" opacity="0.9"/>

    <ellipse cx="512" cy="518" rx="18" ry="13" fill="#F48FB1"/>
    <ellipse cx="506" cy="514" rx="6" ry="4" fill="#FFFFFF" opacity="0.6"/>
    <path d="M512 530 V552" fill="none" stroke="#E07A98" stroke-width="7" stroke-linecap="round"/>
    <path d="M472 558 Q512 598 552 558" fill="none" stroke="#E07A98" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
